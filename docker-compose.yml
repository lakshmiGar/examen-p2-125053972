services:
  hadoop:
    build: ./hadoop
    container_name: hadoop
    hostname: hadoop
    volumes:
      - ./data:/data/input:ro
      - ./mapreduce:/app/mapreduce:ro
      - hadoop_output:/data/output
      - ssh_keys:/shared-ssh
    networks: [datamart-net]

  db:
    image: postgres:16
    container_name: db
    env_file: .env
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [datamart-net]

  api:
    build: ./api
    container_name: api
    env_file: .env
    environment:
      DB_HOST: db
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      hadoop:
        condition: service_started
    volumes:
      - hadoop_output:/data/output:ro
      - ssh_keys:/shared-ssh:ro
      - ./scripts:/scripts:ro
    networks: [datamart-net]

networks:
  datamart-net:

volumes:
  db_data:
  hadoop_output:
  ssh_keys: